name: ci

# bitti's tests (parser, reports, the examples against navigera's bench
# site and bitti's own fixture site) and the 40-scenario suite, on
# Linux, macOS and Windows with the runner's Chrome, built against the
# navigera branch checked out beside it (`../navigera`).

on:
  push:
    branches: [next]
  pull_request:
  workflow_dispatch:
    inputs:
      navigera:
        description: "navigera branch or commit to build against (empty: next, or master for main)"
        default: ""

permissions:
  contents: read

# A newer push to a branch replaces the run of the one before it; a
# dispatch on the same commit runs beside it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # bitti's next builds against navigera's next (its Cargo.lock follows
  # it); main, and a pull request into main, against navigera's master.
  NAVIGERA_REF: ${{ inputs.navigera || ((github.base_ref || github.ref_name) == 'main' && 'master' || 'next') }}

jobs:
  test:
    name: "bitti ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # About three times the slowest OS. With 40 the macOS job spent 34 min
    # here on every run without failing: a start-up cost of the test sites
    # that nothing flagged.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: bitti
    env:
      BITTI_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bitti
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andrey-usa/navigera
          ref: ${{ env.NAVIGERA_REF }}
          path: navigera
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          # bitti is checked out under bitti/ (navigera beside it).
          cache-workspaces: bitti
          cache-on-failure: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: compara (for `expect download … compare`)
        continue-on-error: true
        run: python -m pip install --quiet compara && compara --version
      - name: Tests
        run: |
          set +e -o pipefail
          cargo test --locked --no-fail-fast 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          python3 - test.log "bitti $RUNNER_OS" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          passed = sum(int(m) for m in re.findall(r"test result: \w+\. (\d+) passed", text))
          failed = re.findall(r"^test (\S+) \.\.\. FAILED", text, re.M)
          panics = re.findall(r"panicked at .*?\n(.*?)\n", text, re.S)
          msg = f"{passed} passed, {len(failed)} failed {failed}"
          if panics:
              msg += "\n" + "\n".join(p[:900] for p in panics[:4])
          print(f"::notice title={sys.argv[2]}::" + msg[:3800].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
          exit $code
      - name: The 40-scenario suite
        if: always()
        run: |
          set +e -uo pipefail
          S=bench/suite40
          python3 $S/site/server.py --port 18001 > site40.out 2>&1 &
          python3 $S/gauntlet/server.py --port 18201 --xo-port 18202 --seed 7 --jitter 0 --telemetry 1 > gauntlet.out 2>&1 &
          for _ in $(seq 150); do
            curl -sf -o /dev/null http://127.0.0.1:18001/ && curl -sf -o /dev/null http://127.0.0.1:18202/xo-form && break
            sleep 0.2
          done
          [ -x target/debug/bitti ] || cargo build --locked
          export GAUNTLET_URL=http://127.0.0.1:18201
          ./target/debug/bitti run $S/bt --base-url http://127.0.0.1:18001 --workers 4 \
            --repeat 3 --shuffle --junit suite40.xml 2>&1 | tee suite40.log
          code=${PIPESTATUS[0]}
          tally=$(grep -E "^[0-9]+ passed" suite40.log | tail -1)
          flaky=$(grep -cE "^FLAKY" suite40.log)
          echo "::notice title=bitti suite40 $RUNNER_OS::40 scenarios x3, 4 workers, shuffled: ${tally:-no tally} (flaky: $flaky)"
          exit $code

  action:
    # The GitHub Action as a workflow uses it, against the 40-scenario
    # suite's site: with the latest release's binary, and built from this
    # commit the way a runner with no release binary gets it (the action
    # clones navigera itself: nothing is checked out beside it here).
    name: "the action (${{ matrix.os }}, ${{ matrix.version }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, version: latest }
          - { os: windows-latest, version: latest }
          - { os: ubuntu-24.04, version: source }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bitti
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The site, and a file to run
        shell: bash
        run: |
          python3 bitti/bench/suite40/site/server.py --port 18001 > site.out 2>&1 &
          for _ in $(seq 150); do curl -sf -o /dev/null http://127.0.0.1:18001/ && break; sleep 0.2; done
          mkdir -p t
          printf 'scenario "The shop opens"\n  goto /\n  expect url ends-with /shop\n  expect title contains Acme\n  expect lcp < 30s\n  expect no errors\n' > t/shop.bt
      - id: bt
        uses: ./bitti
        with:
          paths: t
          base-url: http://127.0.0.1:18001
          args: --junit t/report.xml
          version: ${{ matrix.version }}
          navigera-ref: ${{ env.NAVIGERA_REF }}
      - name: What it left
        shell: bash
        env:
          EVIDENCE: ${{ steps.bt.outputs.evidence }}
        run: |
          grep -q 'tests="1"' t/report.xml && grep -q 'failures="0"' t/report.xml
          echo "evidence: $EVIDENCE"

  container:
    # The image (Dockerfile) on amd64 and arm64, run the way the Kubernetes
    # example runs it: another uid, read-only root, no capabilities, the
    # tests mounted, against the 40-scenario suite's site.
    name: "the image (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bitti
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andrey-usa/navigera
          ref: ${{ env.NAVIGERA_REF }}
          path: navigera
          persist-credentials: false
      - name: Build
        run: |
          docker build -f bitti/Dockerfile -t bitti:ci .
          docker image ls bitti:ci --format 'image {{.Size}}'
      - name: Run
        run: |
          python3 bitti/bench/suite40/site/server.py --port 18001 > site.out 2>&1 &
          for _ in $(seq 150); do curl -sf -o /dev/null http://127.0.0.1:18001/ && break; sleep 0.2; done
          mkdir -p t out && chmod 777 out
          printf 'scenario "The shop opens"\n  goto /\n  expect url ends-with /shop\n  expect title contains Acme\n  expect lcp < 30s\n' > t/shop.bt
          start=$(date +%s%N)
          docker run --rm --network host --user 12345 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp --shm-size 512m -e HOME=/tmp \
            -v "$PWD/t:/tests:ro" -v "$PWD/out:/work" \
            bitti:ci run /tests --base-url http://127.0.0.1:18001 --junit /work/junit.xml
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          grep -q 'failures="0"' out/junit.xml
          echo "::notice title=bitti image ${{ matrix.os }}::one scenario, docker run to exit: ${ms} ms"

  lightpanda:
    # The smoke tier: the suite's site scenarios on Lightpanda, but the four
    # that need layout or a second tab (s02 the grid, whose next page loads
    # when a marker scrolls into view: with no layout everything is in view
    # and all 60 products load at once; s19 hover, s20 new tab, s25 the
    # request read after the page left). Any other failure fails the job.
    name: "lightpanda smoke"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bitti
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bitti
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andrey-usa/navigera
          ref: ${{ env.NAVIGERA_REF }}
          path: navigera
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          # bitti is checked out under bitti/ (navigera beside it).
          cache-workspaces: bitti
          cache-on-failure: false
      - name: Lightpanda 1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.0.1 --repo lightpanda-io/browser --pattern lightpanda-x86_64-linux --dir "$RUNNER_TEMP/lp"
          chmod +x "$RUNNER_TEMP/lp/lightpanda-x86_64-linux"
          echo "LIGHTPANDA_BIN=$RUNNER_TEMP/lp/lightpanda-x86_64-linux" >> "$GITHUB_ENV"
      - name: Smoke
        env:
          LIGHTPANDA_DISABLE_TELEMETRY: "1"
        run: |
          cargo build --locked
          python3 bench/suite40/site/server.py --port 18001 > site.out 2>&1 &
          for _ in $(seq 150); do curl -sf -o /dev/null http://127.0.0.1:18001/ && break; sleep 0.2; done
          files=$(ls bench/suite40/bt/s*.bt | grep -v -e s02- -e s19- -e s20- -e s25-)
          code=0
          # Lightpanda drops an action now and then (s08 read 60 cards for 12
          # in ci 43115995578 and passed on the rerun): a scenario that fails
          # once is run again and reported flaky; one that fails twice is red.
          ./target/debug/bitti run $files --base-url http://127.0.0.1:18001 --engine lightpanda --workers 4 --retries 1 > lp.log 2>&1 || code=$?
          cat lp.log
          echo "::notice title=bitti on Lightpanda::$(grep -E '^[0-9]+ passed' lp.log | tail -1) (flaky: $(grep -cE '^FLAKY' lp.log))"
          exit $code

  electron:
    # Electron apps: the example against navigera's fixture app (a fresh app
    # per scenario), with the Electron its npm package downloads. Linux has
    # no display, so xvfb-run.
    name: "electron ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: bitti
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bitti
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andrey-usa/navigera
          ref: ${{ env.NAVIGERA_REF }}
          path: navigera
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          # bitti is checked out under bitti/ (navigera beside it).
          cache-workspaces: bitti
          cache-on-failure: false
      - name: Electron for navigera's fixture app
        working-directory: navigera/tests/fixtures/electron-app
        run: |
          npm install --no-audit --no-fund --no-package-lock
          node node_modules/electron/install.js
          node -e "console.log('electron', require('electron/package.json').version)"
      - name: The Electron example
        env:
          BITTI_REQUIRE_ELECTRON: "1"
        run: |
          set -o pipefail
          run=""
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; fi
          $run cargo test --locked --test examples electron -- --nocapture 2>&1 | tee electron.log
