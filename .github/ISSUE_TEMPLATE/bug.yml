name: Bug report
description: Something bitti did that it should not have, or did not do.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to see it
      description: The .bt file (or the scenario that fails) and what `bitti run` printed.
      render: text
      placeholder: bitti run tests/shop.bt
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What `bitti --version` prints.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, macOS 15, Windows 11
    validations:
      required: true
