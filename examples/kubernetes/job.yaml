# bitti as a Kubernetes (or OpenShift) Job: the tests from a ConfigMap,
# the app at a Service in the cluster, the run's lines on the pod's log,
# JUnit and evidence in its /work/out (an emptyDir: copy them out, or mount
# a volume that outlives the pod, before the pod goes). The image: `docker build -f bitti/Dockerfile`
# (see bitti's README), pushed where the cluster pulls from.
#
#   kubectl create configmap bt-tests --from-file=tests/
#   kubectl apply -f job.yaml && kubectl logs -f job/bitti
apiVersion: batch/v1
kind: Job
metadata:
  name: bitti
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bitti
          image: registry.example.com/bitti:latest
          args: ["run", "/tests", "--base-url", "http://shop.default.svc:8080", "--workers", "2",
                 "--junit", "/work/out/junit.xml", "--evidence", "/work/out/evidence"]
          env:
            # The root filesystem is read-only: Chrome's caches go here.
            - { name: HOME, value: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: tests, mountPath: /tests, readOnly: true }
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
            # Chrome's shared memory: the default 64 MB is too small.
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: tests
          configMap: { name: bt-tests }
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 512Mi }
