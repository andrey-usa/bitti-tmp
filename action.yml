name: bitti
description: Run plain-text web tests (.bt and .feature files) with bitti on the runner's Chrome.
author: andrey-usa
branding:
  icon: check-circle
  color: green

inputs:
  paths:
    description: ".bt/.feature files or directories, separated by spaces"
    default: "."
  base-url:
    description: "where relative URLs (goto /cart) point; else `base` in the file or bitti.toml"
    default: ""
  args:
    description: "more `bitti run` options, separated by spaces (e.g. --workers auto --retries 1 --junit report.xml)"
    default: ""
  working-directory:
    description: "where to run (paths are relative to it)"
    default: "."
  version:
    description: "a bitti release tag (v0.3.0), latest, or source (a build from this action's own commit)"
    default: "latest"
  navigera-ref:
    description: "the navigera branch, tag or commit a source build uses"
    default: "next"

outputs:
  evidence:
    description: "the run's evidence directory (failure screenshots, traces, downloads)"
    value: ${{ steps.run.outputs.evidence }}

runs:
  using: composite
  steps:
    - name: Install bitti
      shell: bash
      env:
        BT_VERSION: ${{ inputs.version }}
        BT_NAVIGERA_REF: ${{ inputs.navigera-ref }}
        BT_ACTION: ${{ github.action_path }}
      run: bash "$BT_ACTION/action/install.sh"
    - name: Run
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BT_PATHS: ${{ inputs.paths }}
        BT_BASE_URL: ${{ inputs.base-url }}
        BT_ARGS: ${{ inputs.args }}
      run: |
        read -ra paths <<< "$BT_PATHS"
        read -ra extra <<< "$BT_ARGS"
        set -- run "${paths[@]}"
        [ -n "$BT_BASE_URL" ] && set -- "$@" --base-url "$BT_BASE_URL"
        evidence="$RUNNER_TEMP/bitti-evidence"
        given=""
        for ((i = 0; i < ${#extra[@]}; i++)); do
          [ "${extra[$i]}" = --evidence ] && given="${extra[$((i + 1))]:-}"
        done
        if [ -n "$given" ]; then evidence="$given"; else set -- "$@" --evidence "$evidence"; fi
        echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
        bitti "$@" "${extra[@]}"
